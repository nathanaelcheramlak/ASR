[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amharic-asr"
version = "0.1.0"
description = "Amharic CTC speech recognition experiments with XLS-R"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "transformers==4.57.6",
    "torchcodec==0.11.0",
    "jiwer==4.0.0",
]

[project.optional-dependencies]
research = [
    "datasets[audio]==4.8.5",
    "accelerate==1.15.0",
    "soundfile>=0.13.1,<1",
    "librosa>=0.11,<1",
    "fsspec",
    "pyarrow",
    "requests",
    "tqdm",
    "ipython",
    "jupyterlab",
]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks/archive", "notebooks/research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
